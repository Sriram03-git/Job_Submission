<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Seeker Application Form</title>
    <link rel="stylesheet" href="seeker.css" />
    <!-- Tailwind CSS CDN for utility classes and dark mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/lottie-player.js"></script>
  </head>
  <body class="transition-colors duration-300">
    <header class="app-header flex items-center justify-between px-6 py-4">
      <h1 class="text-2xl font-bold">Job Application Submission</h1>
      <div class="flex items-center gap-4">
        <button id="my-applications-btn" class="btn btn-secondary">
          My Applications
        </button>
        <button
          id="theme-toggle"
          aria-label="Toggle dark and light theme"
          class="text-xl p-2 rounded-full transition"
        >
          <!-- Icon set by JS -->
        </button>
      </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
      <!-- My Applications Modal -->
      <div
        id="my-applications-modal"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
      >
        <div class="modal-content w-full max-w-2xl p-6 relative">
          <button
            id="close-applications-modal"
            class="absolute top-3 right-4 text-2xl font-bold hover:opacity-70"
          >
            &times;
          </button>
          <h2 class="text-2xl font-bold mb-4">My Applications</h2>
          <div id="status-list" class="space-y-4"></div>
        </div>
      </div>

      <section id="input-section" class="mb-8">
        <form
          id="application-form"
          enctype="multipart/form-data"
          novalidate
          class="form-container p-8 space-y-6"
        >
          <h2 class="text-2xl font-bold text-center mb-6">Apply Now</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="name" class="block font-semibold mb-2"
                >Full Name</label
              >
              <input
                type="text"
                id="name"
                class="input-field"
                placeholder="E.g., Jane Doe"
                pattern="^[A-Z].*"
                required
              />
              <span id="error-name" class="field-error"></span>
            </div>
            <div>
              <label for="emailId" class="block font-semibold mb-2"
                >Email ID</label
              >
              <input
                type="email"
                id="emailId"
                class="input-field"
                placeholder="E.g., jane.doe@example.com"
                required
              />
              <span id="error-emailId" class="field-error"></span>
            </div>
            <div>
              <label for="mobileNumber" class="block font-semibold mb-2"
                >Mobile Number</label
              >
              <input
                type="text"
                id="mobileNumber"
                class="input-field"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                placeholder="E.g., 9876543210"
                required
              />
              <span id="error-mobileNumber" class="field-error"></span>
            </div>
            <div>
              <label for="experienceRange" class="block font-semibold mb-2"
                >Experience Range</label
              >
              <select id="experienceRange" class="input-field" required>
                <option value="" disabled selected>Select Experience</option>
                <option value="Fresher (0 Years)">Fresher (0 Years)</option>
                <option value="1-3 Years">1-3 Years (Entry Level)</option>
                <option value="3-5 Years">3-5 Years (Mid Level)</option>
                <option value="5-8 Years">5-8 Years (Senior)</option>
                <option value="8+ Years">8+ Years (Lead/Architect)</option>
              </select>
              <span id="error-experienceRange" class="field-error"></span>
            </div>
            <div class="md:col-span-2">
              <label for="jobRole" class="block font-semibold mb-2"
                >Job Role Applying For</label
              >
              <select id="jobRole" class="input-field" required>
                <option value="" disabled selected>Select a Job Role</option>
                <!-- Job roles remain the same -->
                <optgroup label="Software Development & Engineering">
                  <option value="Software Development Engineer (SDE I/II)">
                    Software Development Engineer (SDE I/II)
                  </option>
                  <option value="Senior Java Developer">
                    Senior Java Developer
                  </option>
                  <option value="Full Stack Developer (MERN/MEAN)">
                    Full Stack Developer (MERN/MEAN)
                  </option>
                  <option value="Front-end Engineer (React/Angular)">
                    Front-end Engineer (React/Angular)
                  </option>
                  <option value="Back-end Developer (Node.js/Spring Boot)">
                    Back-end Developer (Node.js/Spring Boot)
                  </option>
                  <option value="Mobile App Developer (iOS/Android)">
                    Mobile App Developer (iOS/Android)
                  </option>
                  <option value="Cloud Solutions Architect (Azure/AWS)">
                    Cloud Solutions Architect (Azure/AWS)
                  </option>
                  <option value="DevOps Engineer">DevOps Engineer</option>
                  <option value="Site Reliability Engineer (SRE)">
                    Site Reliability Engineer (SRE)
                  </option>
                  <option value="Embedded Software Engineer">
                    Embedded Software Engineer
                  </option>
                </optgroup>
                <optgroup label="Data & AI/ML">
                  <option value="Data Scientist">Data Scientist</option>
                  <option value="Machine Learning Engineer (MLE)">
                    Machine Learning Engineer (MLE)
                  </option>
                  <option value="Big Data Engineer (Spark/Hadoop)">
                    Big Data Engineer (Spark/Hadoop)
                  </option>
                  <option value="Data Analyst">Data Analyst</option>
                  <option value="Business Intelligence (BI) Developer">
                    Business Intelligence (BI) Developer
                  </option>
                  <option value="AI Researcher">AI Researcher</option>
                  <option value="Data Visualization Specialist">
                    Data Visualization Specialist
                  </option>
                </optgroup>
                <optgroup label="Testing & Quality Assurance">
                  <option value="Quality Assurance (QA) Analyst">
                    Quality Assurance (QA) Analyst
                  </option>
                  <option value="SDET (Software Development Engineer in Test)">
                    SDET (Software Development Engineer in Test)
                  </option>
                  <option value="Automation Test Engineer">
                    Automation Test Engineer
                  </option>
                  <option value="Performance Test Engineer">
                    Performance Test Engineer
                  </option>
                </optgroup>
                <optgroup label="Product, Project, & Management">
                  <option value="IT Project Manager">IT Project Manager</option>
                  <option value="Scrum Master">Scrum Master</option>
                  <option value="Technical Program Manager (TPM)">
                    Technical Program Manager (TPM)
                  </option>
                  <option value="Product Manager (Technical)">
                    Product Manager (Technical)
                  </option>
                  <option value="Business Analyst (BA)">
                    Business Analyst (BA)
                  </option>
                  <option value="Delivery Manager">Delivery Manager</option>
                </optgroup>
                <optgroup label="Consulting, Sales, & Support">
                  <option value="Technology Consultant">
                    Technology Consultant
                  </option>
                  <option value="Cyber Security Analyst">
                    Cyber Security Analyst
                  </option>
                  <option value="Network Engineer">Network Engineer</option>
                  <option value="Technical Support Engineer (L2/L3)">
                    Technical Support Engineer (L2/L3)
                  </option>
                  <option value="IT Service Management (ITSM) Specialist">
                    IT Service Management (ITSM) Specialist
                  </option>
                  <option value="Enterprise Sales Executive">
                    Enterprise Sales Executive
                  </option>
                  <option value="Pre-Sales Solution Architect">
                    Pre-Sales Solution Architect
                  </option>
                </optgroup>
                <optgroup label="Design & Creative">
                  <option value="UX/UI Designer">UX/UI Designer</option>
                  <option value="Graphic Designer">Graphic Designer</option>
                  <option value="Technical Writer">Technical Writer</option>
                  <option value="Content Strategist">Content Strategist</option>
                </optgroup>
                <optgroup label="Specialized Roles">
                  <option value="ERP Consultant (SAP/Oracle)">
                    ERP Consultant (SAP/Oracle)
                  </option>
                  <option value="Salesforce Developer">
                    Salesforce Developer
                  </option>
                  <option value="Blockchain Developer">
                    Blockchain Developer
                  </option>
                  <option value="AR/VR Engineer">AR/VR Engineer</option>
                  <option value="Quantitative Analyst">
                    Quantitative Analyst
                  </option>
                </optgroup>
              </select>
              <span id="error-jobRole" class="field-error"></span>
            </div>
            <div class="md:col-span-2">
              <label for="jobLink" class="block font-semibold mb-2"
                >Job/LinkedIn Profile Link</label
              >
              <input
                type="url"
                id="jobLink"
                class="input-field"
                placeholder="Link to the job posting or your LinkedIn profile"
                required
              />
              <span id="error-jobLink" class="field-error"></span>
            </div>
            <div class="md:col-span-2">
              <label for="resume" class="block font-semibold mb-2"
                >Resume (PDF)</label
              >
              <input
                type="file"
                id="resume"
                class="input-field"
                accept="application/pdf"
                required
              />
              <span id="error-resume" class="field-error"></span>
              <div
                id="upload-progress"
                class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-2 hidden"
              >
                <div
                  id="upload-bar"
                  class="bg-emerald-500 h-2.5 rounded-full"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="md:col-span-2">
              <label for="notes" class="block font-semibold mb-2"
                >Notes (Optional)</label
              >
              <textarea
                id="notes"
                class="input-field"
                rows="3"
                placeholder="Any notes..."
              ></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-full text-lg">
            Submit Application
          </button>
        </form>
      </section>
    </main>

    <!-- Offline Overlay -->
    <div
      id="offline-overlay"
      class="fixed inset-0 bg-black bg-opacity-90 z-[9999] hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-300"
    >
      <lottie-player
        src="/offline_dgaccel.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px"
        loop
        autoplay
      ></lottie-player>
      <h2 class="text-3xl font-bold mt-4 text-white">No Internet Connection</h2>
      <p class="text-gray-300 mt-2 text-lg">
        Please check your network settings.
      </p>
    </div>
    <script src="seeker.js"></script>
  </body>
</html>
