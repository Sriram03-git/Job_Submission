<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruiter Application Dashboard</title>
    <!-- Quick theme pre-apply to prevent flash and ensure persisted choice is honored early -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
            document.addEventListener("DOMContentLoaded", () =>
              document.body.classList.add("dark"),
            );
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="stylesheet" href="recruiter.css" />
    <!-- Tailwind CSS CDN for utility classes and dark mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/lottie-player.js"></script>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="transition-colors duration-300">
    <header class="app-header flex items-center justify-between px-6 py-4">
      <h1 class="text-2xl font-bold flex items-center gap-3">
        <i class="fas fa-tachometer-alt"></i> Recruiter Dashboard
      </h1>
      <div class="flex items-center gap-4">
        <button
          id="theme-toggle"
          aria-label="Toggle dark and light theme"
          class="text-xl p-2 rounded-full transition"
        >
          <!-- Icon will be set by JS -->
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
      <section id="statistics-section" class="mb-8">
        <h2 class="text-2xl font-bold mb-4">Applications Summary</h2>
        <div id="stats-summary" class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="summary-card p-6">
            <p class="text-sm font-medium mb-1">Total Applications</p>
            <span id="total-apps" class="stat-total text-4xl font-bold">0</span>
          </div>
          <div class="summary-card p-6">
            <p class="text-sm font-medium mb-1">Selected/Offer</p>
            <span id="selected-apps" class="stat-selected text-4xl font-bold"
              >0</span
            >
          </div>
          <div class="summary-card p-6">
            <p class="text-sm font-medium mb-1">Rejected</p>
            <span id="rejected-apps" class="stat-rejected text-4xl font-bold"
              >0</span
            >
          </div>
        </div>
      </section>

      <section id="list-section">
        <h2 class="text-2xl font-bold mb-4">Candidate Applications</h2>
        <div class="table-container overflow-x-auto">
          <table id="applications-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Candidate</th>
                <th>Contact</th>
                <th>Experience</th>
                <th>Job Role</th>
                <th>Status</th>
                <th>Submitted At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="applications-list">
              <!-- Candidate rows will render here -->
              <tr>
                <td colspan="8" class="text-center">Loading applications...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Custom Modal UI to replace alert/confirm -->
    <div id="custom-modal">
      <div id="modal-content">
        <p id="modal-message"></p>
        <div id="modal-actions">
          <!-- Buttons will be added by JS -->
        </div>
      </div>
    </div>

    <!-- Offline Overlay -->
    <div
      id="offline-overlay"
      class="fixed inset-0 bg-black bg-opacity-90 z-[9999] hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-300"
    >
      <lottie-player
        src="/offline_dgaccel.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px"
        loop
        autoplay
      ></lottie-player>
      <h2 class="text-3xl font-bold mt-4 text-white">No Internet Connection</h2>
      <p class="text-gray-300 mt-2 text-lg">
        Please check your network settings.
      </p>
    </div>

    <script src="recruiter.js"></script>
  </body>
</html>
